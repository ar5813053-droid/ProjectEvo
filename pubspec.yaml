name: project_evo
description: ProjectEVO — evolving personal AI assistant for Android. Memory, research, evaluation.
publish_to: "none"
version: 0.3.0+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2
  http: ^1.2.2
  intl: ^0.19.0
  uuid: ^4.4.2
  collection: ^1.18.0
  meta: ^1.12.0
  # On-device LLM — Flutter Edge AI (successor to flutter_gemma)
  # MediaPipe engine runs Gemma 3 .task models on Android.
  flutter_edge_ai: ^2.1.0
  flutter_edge_ai_mediapipe: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
